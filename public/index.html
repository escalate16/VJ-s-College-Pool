function watch(load,cb){let last='';const run=async()=>{try{const v=await load();const s=JSON.stringify(v);if(s!==last){last=s;cb(v)}}catch(e){}};run();pollers.push(run)}

const api=b=>post('/api/db',b);
const clone=o=>JSON.parse(JSON.stringify(o));
function docRef(p){const i=p.indexOf('/'),c=p.slice(0,i),id=p.slice(i+1);
  const snap=d=>({exists:!!d,id,data:()=>d?clone(d.data):undefined});
  return{async get(){return snap((await api({op:'get',c,id})).doc)},
    async set(o){await api({op:'set',c,id,data:o});refresh()},
    async update(o){await api({op:'update',c,id,data:o});refresh()},
    async delete(){await api({op:'delete',c,id});refresh()},
    onSnapshot(cb){watch(async()=>(await api({op:'get',c,id})).doc,d=>cb(snap(d)))}}}

<script>

// away@home, in the order listed by the source (last game of each week = tiebreaker by default)
const SCHED={};

    if(window.vjCall){const hot=()=>games.some(g=>g.live||(g.ko&&Date.now()-Date.parse(g.ko)<5*36e5&&Date.parse(g.ko)-Date.now()<18e5));const run=first=>{if(document.hidden)return;if(!canEdit&&!first&&!hot())return;window.vjCall('/api/scores',canEdit?{}:{auto:1}).then(r=>{if(canEdit){scMsg='Scores checked '+new Date().toLocaleTimeString()+': '+r.finals+' final, '+r.live+' live, '+r.times+' kickoff times updated.';if(tab==='admin')softRender()}}).catch(()=>{})};run(true);setInterval(()=>run(false),60000)}
  }catch(e){fail();return}
  const t=setTimeout(()=>{$('#status').textContent='Still loading… check your connection.'},10000);
  db.collection('games').onSnapshot(s=>{clearTimeout(t);games=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;render();autoSync()},e=>{$('#status').textContent='Could not load games.'});
  db.collection('picks').onSnapshot(s=>{plReady=true;players={};s.docs.forEach(d=>{const x=d.data();players[d.id]=x;if(x.s2&&x.name)players[d.id+'__2']={name:x.name+' #2',picks:x.picks2||{},tb:x.tb2||{},lc:x.lc2||{},cr:x.cr2||{},virt:1}});if(players[uid]&&!saving&&Date.now()-lastSave>3000)me={name:'',picks:{},tb:{},...players[uid]};render()});
}
function fail(){$('#status').textContent='Sign in to claude.ai to join the pool.'}

const GATE=!!window.vjCall;
const cfm=(id,gid)=>{if(!GATE||flags.auto||(flags.trusted||[]).includes(base(id)))return true;const c=pconf[base(id)];const m=c?(String(id).endsWith('__2')?c.c2:c.c):null;return !!(m&&m[gid])};
function score(w){
  const gs=wkGames(w),act=roundAct(w);
  return Object.entries(players).filter(([,p])=>p.name).map(([id,p])=>{
    const apOn=!!apSide()&&!!ps(id,w);
    const cfw=isConf(w);let c=0,l=0,pts=0;gs.forEach(g=>{const x=winner(g);let pk=cfm(id,g.id)?p.picks?.[g.id]:undefined;if(!pk&&apOn&&sealed(g))pk=apSide();if(x&&pk){if(pk===x){c++;if(cfw)pts+=(+(p.cr&&p.cr[g.id])||0)}else{l++;if(cfw)pts-=(+(p.cr&&p.cr[g.id])||0)}}});
    const guess=p.tb?.[w];
    return{id,name:p.name||'Anonymous',c,l,p:cfw?pts:undefined,guess,diff:act!=null&&typeof guess==='number'?Math.abs(guess-act):null};
  });
}
function rank(rows){
  const key=r=>[-(r.p!==undefined?r.p:r.c),r.diff??1e9];
  rows.sort((a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||x[1]-y[1]||a.name.localeCompare(b.name)});
  let pos=0;rows.forEach((r,i)=>{if(i&&key(r)[0]===key(rows[i-1])[0]&&key(r)[1]===key(rows[i-1])[1]){r.pos=rows[i-1].pos}else r.pos=i+1});
  return rows;
}
function adminGames(){
  const gs=wkAll(week);
  let h=`<div class="card"><b>Featured games</b><div class="note">Each week the pool automatically adds up to 12 of the biggest games, the ones with a Top 25 team (ranked matchups first). Bowls and College Football Playoff games are added too. Delete any you do not want, or use "Add a game" for extras. Games and scores refresh on their own.</div><button id="imp">Load games now</button></div><div class="card row"><span class="grow"><b>${wl(week)}</b></span><button data-lkw="1">Lock / unlock all</button></div><div class="card"><b>Add a game · ${wl(week)}</b><div class="row" style="margin-top:8px">${tsel('aw','Away team')}${tsel('hm','Home team')}<button id="add">Add</button></div></div>`;
  gs.forEach(g=>{h+=`<div class="card"><div class="row"><b class="grow">${tn(g.away)} @ ${tn(g.home)}</b><button data-lk="${g.id}">${g.locked?'Unlock':'🔒 Lock'}</button><button data-vd="${g.id}">${g.void?'Restore':'Void'}</button><button data-tbg="${g.id}" class="${g.id===tbGame(week).id?'on':''}">Tiebreaker</button><button data-del="${g.id}">✕</button></div>
  <div class="row" style="margin-top:8px"><span class="tag">Kickoff:</span><input type="datetime-local" id="k${g.id}" value="${koVal(g)}"><button data-ko="${g.id}">Set</button></div><div class="row" style="margin-top:8px"><span class="tag">Final:</span><input type="number" id="a${g.id}" min="0" placeholder="${esc(g.away)}" value="${g.as??''}"><span>–</span><input type="number" id="h${g.id}" min="0" placeholder="${esc(g.home)}" value="${g.hs??''}"><button data-fin="${g.id}">Final</button><button data-liv="${g.id}">Live</button></div></div>`});
  return h+`<div class="note">Players need Contributor access to the page to save picks. Locking a game stops further picks on it.</div>`;

let saving=0,lastSave=0;
async function savePicks(){saving++;try{await db.doc('picks/'+uid).set({name:me.name||'',csw:!!me.csw,picks:me.picks||{},tb:me.tb||{},lc:me.lc||{},ref:me.ref||'',refId:me.refId||'',cr:me.cr||{},cr2:me.cr2||{},s2:!!me.s2,picks2:me.picks2||{},tb2:me.tb2||{},lc2:me.lc2||{},pa:me.pa||{},fav:me.fav||'',fc:me.fc||{}})}catch(e){toast('Could not save. Ask the commissioner for Contributor access.')}finally{saving--;lastSave=Date.now()}}
let plReady=false;
const G=id=>games.find(g=>g.id===id);
const tsel=(id,ph)=>`<select id="${id}" class="grow"><option value="">${ph}</option>${[...new Set(games.flatMap(g=>[g.away,g.home]))].filter(Boolean).sort().map(n=>`<option>${n}</option>`).join('')}</select>`;
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-t]');if(!b||!db)return;
  const d=b.dataset;
  if(d.t){tab=d.t;render()}
  else if(d.p){const[id,s]=d.p.split('|');if(isLocked(G(id))&&!(inGrace(G(id))&&me[SK()[2]]?.[id]))return;const pc={...me[SK()[0]]};if(pc[id]===s){if(isLocked(G(id)))return;delete pc[id]}else pc[id]=s;me[SK()[0]]=pc;qpDrop(id);me.name=$('#nm')?.value.trim()||me.name;render();savePicks()}
  else if(b.id==='add'){const a=$('#aw').value.trim(),h=$('#hm').value.trim();if(!a||!h)return;await db.collection('games').add({week,away:a,home:h,order:Date.now(),locked:false,tb:false,as:null,hs:null})}

  else if(b.id==='imp'){importSched()}
  else if(d.lkw){const l=wkGames(week),v=!l.every(g=>g.locked);for(const g of l)if(!!g.locked!==v)await db.doc('games/'+g.id).update({locked:v})}
  else if(d.lk){const g=G(d.lk);await db.doc('games/'+g.id).update({locked:!g.locked})}
  else if(d.vd){const g=G(d.vd);await db.doc('games/'+g.id).update({void:!g.void})}
  else if(d.tbg){for(const g of wkGames(week)){const v=g.id===d.tbg;if(!!g.tb!==v||!!g.tbSet!==v)await db.doc('games/'+g.id).update({tb:v,tbSet:v})}}
  else if(d.del){if(delArm===d.del){delArm='';await db.doc('games/'+d.del).delete()}else{delArm=d.del;toast('Tap the X again to delete this game.');setTimeout(()=>{delArm=''},4000)}}
  else if(d.fin){const a=$('#a'+d.fin).value,h=$('#h'+d.fin).value;await db.doc('games/'+d.fin).update(a===''||h===''?{as:null,hs:null}:{as:+a,hs:+h,locked:true,live:false})}
  else if(d.liv){const a=$('#a'+d.liv).value,h=$('#h'+d.liv).value;if(a===''||h==='')return;await db.doc('games/'+d.liv).update({as:+a,hs:+h,locked:true,live:true})}

document.addEventListener('change',e=>{
  if(e.target.id==='wk'){week=+e.target.value;render()}
  else if(e.target.id==='bf_pl'){bfPl=e.target.value;bfKey='';softRender()}

  else if(e.target.id&&e.target.id.indexOf('cr_')===0){const gid=e.target.id.slice(3),k=CK(),cr={...(me[k]||{})},v=+e.target.value||0,old=cr[gid]||0;if(v){const o=Object.keys(cr).find(x=>x!==gid&&cr[x]===v);if(o){if(old)cr[o]=old;else delete cr[o]}cr[gid]=v}else delete cr[gid];me[k]=cr;me.name=$('#nm')?.value.trim()||me.name;savePicks();render()}
  else if(e.target.id==='tb'){const v=e.target.value;me[SK()[1]]={...me[SK()[1]],[week]:v===''?null:+v};me.name=$('#nm')?.value.trim()||me.name;savePicks()}
});
/* ===== v2: pool name, rules, payments, contacts, cutoff, pick sheet ===== */
const ENTRY=10,FEE=2,LATE=5,CHG=5,PROF=5;
let scMsg='',rsMsg='',rsArm='',assistL=[],season={},pconf={},xpot={},flags={},hcRes=[],bfPl='',bfKey='',bfSel={},bfTb='',delArm='',isOwn=false,sq={},sqc={},sh=1,lfp={},memo={},paid={},settings={},mem={},allMem={},extraDone=false,sig='',msg='';
const ab=n=>Object.keys(T).find(k=>T[k]===n)||n;
const enc=encodeURIComponent;
const isLocked=g=>!g||!!(g.locked||isFinal(g)||g.live||(g.ko&&Date.now()>=Date.parse(g.ko)));
const TF={weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'};
const fmtKo=g=>g.ko?new Date(g.ko).toLocaleString([],TF):'';
const closeKo=g=>g.ko?new Date(Date.parse(g.ko)).toLocaleString([],TF):'';
const koVal=g=>g.ko?new Date(Date.parse(g.ko)-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';

let chat=[],su={},sup={},suc={},chDraft='';
const suOn=()=>GATE&&!!suc.on;
const suStart=()=>Math.max(1,+suc.start||1);
const suPaidIds=()=>Object.keys(sup).filter(k=>sup[k]&&sup[k].on&&k.indexOf('__')<0);
const suName=id=>(players[id]&&players[id].name)||(su[id]&&su[id].name)||'Player';
const suGame=(w,t)=>wkAll(w).find(x=>x.away===t||x.home===t);
function suRes(w,t){const g=suGame(w,t);if(!g)return'';if(g.void)return'ok';if(!isFinal(g))return'';const x=winner(g);if(!x)return'out';return((x==='h'&&g.home===t)||(x==='a'&&g.away===t))?'ok':'out'}
function suState(id){
  const p=(su[id]&&su[id].p)||{},cells=[];let out=0;
  for(let w=suStart();w<=18;w++){
    const t=p[w];
    if(!t){const gs=wkGames(w);if(gs.length&&gs.every(isFinal)){out=w;cells.push({w,t:'',r:'miss'});break}continue}

function suPot(){return suPaidIds().length*(+suc.fee||0)}

  const alive=ids.filter(x=>!x.st.out).length,start=suStart();
  let h=`<div class="card"><b>Survivor</b><div class="note">Pick <b>one team each week</b> to win. If it wins, you move on. If it loses, ties or you forget to pick, you are out. You can use each team only once all season. Last player standing wins the pot. Entry ${fmtD(+suc.fee||0)}, paid to the commissioner. Starts ${wl(start)}.</div><div class="row"><span class="tag">Pot</span><b>${fmtD(suPot())}</b><span class="tag">Alive</span><b>${alive}</b><span class="tag">Entered</span><b>${ids.length}</b></div></div>`;

  if(!mine)h+=`<div class="card"><b>Want in?</b><div class="note">Pay ${fmtD(+suc.fee||0)} to the commissioner and ask to be added to Survivor.</div></div>`;
  else{
    const me2=suState(uid),p=(su[uid]&&su[uid].p)||{};
    if(me2.out)h+=`<div class="card"><b>You are out</b><div class="note">${me2.cells.length&&me2.cells[me2.cells.length-1].r==='miss'?'No pick was made in '+wl(me2.out)+'.':'Your pick lost in '+wl(me2.out)+'.'}</div></div>`;
    else if(week>=start&&week<=18){
      const used=Object.keys(p).filter(k=>+k!==week).map(k=>p[k]),cur=p[week],cg=cur&&suGame(week,cur),curLocked=cg&&isLocked(cg);
      const opts=[];wkGames(week).forEach(g=>{[g.away,g.home].forEach(t=>{if(!used.includes(t)&&!isLocked(g))opts.push(t)})});
      h+=`<div class="card"><b>Your pick for ${wl(week)}</b>${cur?`<div class="note">Current pick: <b>${esc(cur)}</b>${curLocked?' (locked)':''}</div>`:'<div class="note">You have not picked yet.</div>'}`;
      if(!curLocked)h+=opts.length?`<div class="row"><select id="su_sel"><option value="">Choose a team</option>${[...new Set(opts)].sort().map(t=>`<option value="${esc(t)}"${t===cur?' selected':''}>${esc(t)}</option>`).join('')}</select><button data-supick="1">Lock it in</button></div>`:'<div class="note">No teams left to pick this week.</div>';
      h+=`<div class="note">Teams you already used: ${used.length?used.map(esc).join(', '):'none'}</div></div>`;
    }
  }

/* ===== Football Crush ===== */
const CG_N=8,CG_QMOVES=25,CG_LEVELS=40,CG_SYM=['🏈','🏆','🚩','👟','📣','🎽'],CG_COL=['#a8672a','#d9a81e','#d64541','#2f86c7','#8a47cf','#25a05a'];
const CG_SHAPES=[
 ['11111111','11111111','11111111','11111111','11111111','11111111','11111111','11111111'],
 ['00111100','01111110','11111111','11111111','11111111','11111111','01111110','00111100'],
 ['00011000','00111100','01111110','11111111','11111111','01111110','00111100','00011000'],
 ['11111111','01111110','00111100','00011000','00011000','00111100','01111110','11111111'],
 ['11111111','11111111','11000011','11000011','11000011','11000011','11111111','11111111'],
 ['00111100','00111100','11111111','11111111','11111111','11111111','00111100','00111100'],
 ['11011011','11111111','01111110','11111111','11111111','01111110','11111111','11011011'],
 ['11100111','11100111','11111111','00111100','00111100','11111111','11100111','11100111']];
const CG_SHAPE_NAMES=['Full field','Rounded field','Diamond','Hourglass','Stadium ring','Plus','Scattered','Butterfly'];
let cg=null,cgScreen='home',CG_FAST=false,cgK=6;
const cgWait=ms=>new Promise(r=>setTimeout(r,CG_FAST||(typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches)?0:ms));
const cgRnd=()=>({t:Math.floor(Math.random()*cgK),s:null});
const cgKey=()=>Math.floor((Date.now()+2*864e5)/6048e5);
const cgMask=i=>CG_SHAPES[i].map(r=>[...r].map(Number));
function cgLevelDef(n){
  const si=(n-1)%CG_SHAPES.length,mask=cgMask(si),kinds=n<5?4:n<16?5:6,gt=(n-1)%4,goals=[];let turf=null,moves=Math.max(20,28-Math.floor(n/5))+Math.min(8,Math.floor(Math.max(0,n-40)/8));
  const sc=Math.round(Math.min(2600,240+55*n)/10)*10,ct=(n*2)%kinds,cn=Math.min(26,8+Math.floor(n*0.7));
  if(gt===0)goals.push({k:'score',v:sc});

  else if(gt===2){goals.push({k:'turf'});moves+=3;const r1=n<20?3:2,r2=n<20?4:5;turf=mask.map((row,r)=>row.map(v=>!!v&&r>=r1&&r<=r2))}
  else{goals.push({k:'score',v:Math.round(sc*0.8/10)*10});goals.push({k:'col',t:(ct+1)%kinds,v:Math.round(cn*0.7)});moves+=2}

}
const cgQuickDef=()=>({n:0,name:'Quick game',mask:cgMask(0),kinds:6,moves:CG_QMOVES,goals:[],turf:null});
function cgMatches(b){
  const cells=new Set(),runs=[],T=(r,c)=>b[r][c]?b[r][c].t:-2;
  for(let r=0;r<CG_N;r++){let c=0;while(c<CG_N){const t=T(r,c);let e=c;while(t>=0&&e+1<CG_N&&T(r,e+1)===t)e++;if(t>=0&&e-c>=2){const cs=[];for(let k=c;k<=e;k++){cs.push([r,k]);cells.add(r+','+k)}runs.push({cells:cs,len:e-c+1})}c=e+1}}
  for(let c=0;c<CG_N;c++){let r=0;while(r<CG_N){const t=T(r,c);let e=r;while(t>=0&&e+1<CG_N&&T(e+1,c)===t)e++;if(t>=0&&e-r>=2){const cs=[];for(let k=r;k<=e;k++){cs.push([k,c]);cells.add(k+','+c)}runs.push({cells:cs,len:e-r+1})}r=e+1}}
  return{cells,runs};

function cgFindMove(b){
  for(let r=0;r<CG_N;r++)for(let c=0;c<CG_N;c++){
    if(!b[r][c])continue;
    if(b[r][c].s==='T')return[[r,c],[r,c+1<CG_N&&b[r][c+1]?c+1:c-1]];
    for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=CG_N||c2>=CG_N||!b[r2][c2])continue;
      const x=b[r][c];b[r][c]=b[r2][c2];b[r2][c2]=x;const ok=cgMatches(b).runs.length>0||b[r][c].s==='T'||b[r2][c2].s==='T';b[r2][c2]=b[r][c];b[r][c]=x;if(ok)return[[r,c],[r2,c2]]}
  }
  return null;
}
function cgBoard(mask){
  const mk=()=>mask.map(row=>row.map(v=>v?cgRnd():null));
  for(let tries=0;tries<300;tries++){
    const b=mk();
    for(let g=0;g<80&&cgMatches(b).cells.size;g++)cgMatches(b).cells.forEach(k=>{const[r,c]=k.split(',').map(Number);b[r][c]=cgRnd()});
    if(!cgMatches(b).cells.size&&cgFindMove(b))return b;
  }
  return mask.map((row,r)=>row.map((v,c)=>v?{t:(r*2+c)%Math.max(3,cgK),s:null}:null));
}
function cgStart(def){
  cgK=def.kinds;
  cg={def,mode:def.n?'l':'q',b:cgBoard(def.mask),mask:def.mask,turf:def.turf?def.turf.map(r=>[...r]):null,score:0,moves:def.moves,coll:{},sel:null,busy:false,over:false,res:null,stars:0,msg:'',pop:new Set(),drop:new Set(),hint:null,newBest:false};
  cg.turfLeft=cg.turf?cg.turf.flat().filter(Boolean).length:0;cgScreen='play';
}
function cgExpand(clear){
  const q=[...clear];let bonus=0;
  const add=(r,c)=>{const k=r+','+c;if(cg.b[r][c]&&!clear.has(k)){clear.add(k);q.push(k)}};
  while(q.length){const[r,c]=q.pop().split(',').map(Number),x=cg.b[r][c];if(!x)continue;
    if(x.s==='L'){bonus+=30;for(let i=0;i<CG_N;i++){add(r,i);add(i,c)}}
    else if(x.s==='T'){bonus+=50;const ty=cg.b.flat().filter(y=>y&&y.t>=0).map(y=>y.t),tt=ty.length?ty[Math.floor(Math.random()*ty.length)]:0;for(let i=0;i<CG_N;i++)for(let j=0;j<CG_N;j++)if(cg.b[i][j]&&cg.b[i][j].t===tt)add(i,j)}}
  return bonus;
}
async function cgClear(clear,spawn,mult){
  const bonus=cgExpand(clear);
  cg.score+=(clear.size*10+bonus)*mult;
  clear.forEach(k=>{const[r,c]=k.split(',').map(Number),x=cg.b[r][c];if(x&&x.t>=0)cg.coll[x.t]=(cg.coll[x.t]||0)+1;if(cg.turf&&cg.turf[r][c]){cg.turf[r][c]=false;cg.turfLeft--}});
  cg.pop=clear;cgDraw();await cgWait(240);cg.pop=new Set();
  const sp=new Map(spawn.map(x=>[x.r+','+x.c,x]));
  clear.forEach(k=>{const[r,c]=k.split(',').map(Number),x=sp.get(k);cg.b[r][c]=x?{t:x.s==='T'?-1:x.t,s:x.s}:null});
  const drop=new Set();
  for(let c=0;c<CG_N;c++){let r=CG_N-1;while(r>=0){
    if(!cg.mask[r][c]){r--;continue}
    let r2=r;while(r2>=0&&cg.mask[r2][c])r2--;
    const top=r2+1,col=[];for(let i=r;i>=top;i--)if(cg.b[i][c])col.push({x:cg.b[i][c],r0:i});
    const keep=col.length;while(col.length<r-top+1)col.push({x:cgRnd(),r0:-1});
    for(let k=0;k<col.length;k++){const rr=r-k;cg.b[rr][c]=col[k].x;if(k>=keep||col[k].r0!==rr)drop.add(rr+','+c)}
    r=r2}}
  cg.drop=drop;cgDraw();await cgWait(280);cg.drop=new Set();
}
async function cgResolve(swapPos){
  let mult=1;
  for(let guard=0;guard<40;guard++){
    const m=cgMatches(cg.b);if(!m.runs.length)break;
    const clear=new Set(m.cells),spawn=new Map();
    m.runs.forEach(run=>{if(run.len>=4){const pos=(swapPos&&run.cells.find(p=>swapPos.some(q=>q[0]===p[0]&&q[1]===p[1])))||run.cells[Math.floor(run.len/2)],k=pos[0]+','+pos[1],cur=spawn.get(k),s=run.len>=5?'T':'L';if(!cur||s==='T')spawn.set(k,{r:pos[0],c:pos[1],t:cg.b[pos[0]][pos[1]].t,s})}});
    cg.msg=mult>1?'Cascade x'+mult+'!':'';
    await cgClear(clear,[...spawn.values()],mult);
    swapPos=null;mult++;

function cgGoalsMet(){return cg.def.goals.length>0&&cg.def.goals.every(g=>g.k==='score'?cg.score>=g.v:g.k==='col'?(cg.coll[g.t]||0)>=g.v:cg.turfLeft<=0)}
async function cgSwap(a,b){
  const B=cg.b,x=B[a[0]][a[1]],y=B[b[0]][b[1]];
  B[a[0]][a[1]]=y;B[b[0]][b[1]]=x;
  if(x.s==='T'||y.s==='T'){
    const tp=x.s==='T'?b:a,op=x.s==='T'?a:b,T=B[tp[0]][tp[1]],O=B[op[0]][op[1]],clear=new Set([tp[0]+','+tp[1]]);
    T.s=null;
    if(O.s==='T'){for(let i=0;i<CG_N;i++)for(let j=0;j<CG_N;j++)if(B[i][j])clear.add(i+','+j);O.s=null}
    else{clear.add(op[0]+','+op[1]);for(let i=0;i<CG_N;i++)for(let j=0;j<CG_N;j++)if(B[i][j]&&B[i][j].t===O.t)clear.add(i+','+j)}
    cg.moves--;cg.msg='Touchdown!';await cgClear(clear,[],1);await cgResolve(null);
  }else{
    if(!cgMatches(B).runs.length){cgDraw();await cgWait(180);B[a[0]][a[1]]=x;B[b[0]][b[1]]=y;cg.msg='No match there. Try another swap.';return}
    cg.moves--;await cgResolve([a,b]);

function cgWin(){
  cg.over=true;cg.res='win';cg.sel=null;cg.hint=null;
  const fr=cg.moves/cg.def.moves;cg.stars=fr>=0.4?3:fr>=0.2?2:1;
  const f={...(me.fc||{})},lv={max:(f.lv&&f.lv.max)||1,st:{...((f.lv&&f.lv.st)||{})}},n=cg.def.n;
  lv.st[n]=Math.max(lv.st[n]||0,cg.stars);lv.max=Math.max(lv.max,n+1);me.fc={...f,lv};

}
function cgOver(){
  cg.over=true;const k=cgKey(),f={...(me.fc||{})},wk={...(f.wk||{})};
  const keep={};Object.keys(wk).filter(x=>+x>=k-3).forEach(x=>keep[x]=wk[x]);
  cg.newBest=cg.score>(f.best||0);
  keep[k]=Math.max(keep[k]||0,cg.score);me.fc={...f,best:Math.max(f.best||0,cg.score),plays:(f.plays||0)+1,wk:keep};

    else if(b.id==='bfsave'){if(!players[bfPl])return;const bid=base(bfPl),two=String(bfPl).endsWith('__2'),pk=two?'picks2':'picks',tk=two?'tb2':'tb',dc=players[bid]||{};await db.doc('picks/'+bid).update({[pk]:{...bfSel},[tk]:{...(dc[tk]||{}),[week]:bfTb===''?null:+bfTb}});
      if(GATE){const cur=pconf[bid]||{},key=two?'c2':'c',nc={...(cur[key]||{})};wkGames(week).forEach(g=>{if(bfSel[g.id])nc[g.id]=true;else delete nc[g.id]});await db.doc('pconf/'+bid).set({...cur,[key]:nc})}
      toast('Picks saved \u2713',1);return}
    else if(b.id==='bfall'){const upd={};joined().forEach(([id,p])=>{const bid=base(id),key=String(id).endsWith('__2')?'c2':'c';wkGames(week).forEach(g=>{if(p.picks&&p.picks[g.id]){upd[bid]=upd[bid]||{...(pconf[bid]||{})};upd[bid][key]={...(upd[bid][key]||{}),[g.id]:true}}})});const ks=Object.keys(upd);for(const k of ks)await db.doc('pconf/'+k).set(upd[k]);toast(ks.length?'Confirmed \u2713':'Nothing pending',1);return}
    else if(b.id==='lauto'){await db.doc('settings/letters').set({...lcfg,_set:undefined,auto:lcfg.auto===false})}
    else if(d.lprev||d.lsend||d.lmail||d.ltext){const oc=letOccasions().find(x=>x.key===(d.lprev||d.lsend||d.lmail||d.ltext));if(!oc)return;
      if(d.ltext){const to=letItems(oc).map(x=>x.phone).filter(Boolean);if(!to.length){toast('No player has added a phone number yet.');return}msgModal({kind:'text',to,body:letBody(oc,uid).sms});return}
      if(d.lprev){const bd=letBody(oc,uid);msgModal({kind:'text',to:[],body:bd.body});return}
      if(d.lmail){const to=letItems(oc).map(x=>x.email).filter(Boolean);msgModal({kind:'email',to,bcc:true,subject:letBody(oc,uid).subject,body:letBody(oc,uid).body});return}
      b.disabled=true;try{const r=await letSend(oc,true);toast('Sent: '+(r.email||0)+' emails, '+(r.sms||0)+' texts'+(ntf.email||ntf.sms?'':' (posted in Chat; automatic sending is not set up yet)'),1)}catch(x){toast(x.message||'Could not send')}b.disabled=false;return}
    else if(b.id==='xsave'){const v=+g('xp_amt')||0,va=+g('xp_all')||0;await db.doc('settings/xpot').set({...xpot,s:va,[week]:v});toast('Saved \u2713',1);return}
    else if(d.pd){const[id,v]=d.pd.split('|'),cur={...(paid[id]||{})};if(cur[week]===v)delete cur[week];else cur[week]=v;await db.doc('paid/'+id).set({w:cur,lf:lfp[id]||{}})}
    else if(d.ko){const v=$('#k'+d.ko).value;await db.doc('games/'+d.ko).update({ko:v?new Date(v).toISOString():null})}
    else if(d.lc){if(!inGrace(G(d.lc)))return;me[SK()[2]]={...me[SK()[2]],[d.lc]:true};await savePicks()}
    else if(d.lf){const[id,n]=d.lf.split('|');await db.doc('paid/'+id).set({w:paid[id]||{},lf:{...(lfp[id]||{}),[week]:+n}})}
    else if(b.id==='tsave'){const open=!roundLocked(week)||(roundGrace(week)&&me[SK()[2]]?.['T'+week]);if(!open)return;const v=g('tpts');me[SK()[1]]={...me[SK()[1]],[week]:v===''?null:+v};await savePicks()}
    else if(d.lct){if(!roundGrace(+d.lct))return;me[SK()[2]]={...me[SK()[2]],['T'+d.lct]:true};await savePicks()}
    else if(d.sq){if(!players[uid]?.name||sqClosed())return;const x=sq[d.sq];
      if(x&&x.o===uid){if(!x.paid)await db.doc('squares/'+d.sq).delete();return}
      if(x||sqMine()>=SQMAX)return;
      const cur=await db.doc('squares/'+d.sq).get();if(cur.exists)return;
      await db.doc('squares/'+d.sq).set({o:uid,n:me.name,paid:false})}
    else if(b.id==='sqsave'){const v=g('sqdl');await db.doc('sqcfg/board').set({...sqc,a:g('sqa'),b:g('sqb'),deadline:v?new Date(v).toISOString():'',fee:+g('sqfee')||0,bonus:+g('sqbon')||0})}
    else if(b.id==='sqcover'){const ids=[];for(let i=0;i<100;i++)if(!sq[sqId(i)])ids.push(sqId(i));await sqBatch(ids,id=>db.doc('squares/'+id).set({o:'house',n:'House',paid:true}))}
    else if(b.id==='sqrel'){const ids=Object.entries(sq).filter(([,x])=>!x.paid&&x.o!=='house').map(([id])=>id);await sqBatch(ids,id=>db.doc('squares/'+id).delete())}
    else if(b.id==='sqrun'){await db.doc('sqcfg/board').set({...sqc,runAsIs:true})}
    else if(b.id==='sqdraw'){if(sqCount()<100&&!sqc.runAsIs)return;await db.doc('sqcfg/board').set({...sqc,phase:'drawn',da:sqShuf(),db:sqShuf(),drawnAt:Date.now()})}
    else if(b.id==='sqscores'){const n={...sqc};['q1','q2','q3','q4'].forEach(k=>{const a=g(k+'a'),c=g(k+'b');if(a!==''&&c!=='')n[k]={a:+a,b:+c};else delete n[k]});await db.doc('sqcfg/board').set(n)}
    else if(d.sqpay){const ids=Object.entries(sq).filter(([,x])=>x.o===d.sqpay).map(([id])=>id),all=ids.every(id=>sq[id].paid);await sqBatch(ids,id=>db.doc('squares/'+id).update({paid:!all}))}
    else if(d.sv){sv=d.sv;render()}
    else if(b.id==='sumcopy'){try{await navigator.clipboard.writeText(roundSummary(week));toast('Copied \u2713',1)}catch(x){const t=$('#sumbox');if(t)t.select();toast('Select all of the text below and copy it.')}}
    else if(b.id==='sumemail'){const a=document.createElement('a');a.href='mailto:'+enc(settings.email||'')+'?subject='+enc("VJ's College Pool summary")+'&body='+enc(roundSummary(week));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
    else if(b.id==='pcsend'){const note=g('pcnote');await db.doc('members/'+uid).set({...mem,pc:{...(mem.pc||{}),[week]:{ts:Date.now(),note,n:1+(me.s2?1:0)}}});toast('Sent to the commissioner \u2713',1)}
    else if(d.sh){if(d.sh==='add'){me.s2=true;sh=2;await savePicks()}else{sh=+d.sh;render()}}
    else if(b.id==='chreq'){await db.doc('members/'+uid).set({...mem,chg:{st:'req',ts:Date.now(),fee:PROF}})}
    else if(d.chok){const m=allMem[d.chok];await db.doc('members/'+d.chok).set({...m,chg:{...m.chg,st:'ok'}})}
    else if(d.chfee){const m=allMem[d.chfee];await db.doc('members/'+d.chfee).set({...m,chg:{...m.chg,feePaid:true}})}
    else if(b.id==='cosome'||b.id==='coall'){const av=Math.max(0,earnings(uid)-coTotal(mem));const amt=b.id==='coall'?av:Math.min(av,+g('co_amt')||0);if(!(amt>0)||!mem.zelle)return;await db.doc('members/'+uid).set({...mem,co:[...coList(mem),{id:Date.now(),amt:Math.round(amt*100)/100,st:'req'}]})}
    else if(d.cos){const[b0,id]=d.cos.split('|');const m=allMem[b0];await db.doc('members/'+b0).set({...m,co:coList(m).map(c=>String(c.id)===id?{...c,st:'sent'}:c)})}
    else if(d.cp){const t=d.cp==='z'?(settings.zelle||''):(allMem[base(d.cp)]?.zelle||'');try{await navigator.clipboard.writeText(t);b.textContent='Copied \u2713'}catch(x){toast('Copy this: '+t)}}
    else if(d.em||d.tx){
      const who=d.em||d.tx,key=d.em?'email':'phone',kind=d.kind;
      const list=who==='all'?Object.values(allMem).map(m=>m[key]).filter(Boolean):who==='admin'?[settings[key]].filter(Boolean):[allMem[base(who)]?.[key]].filter(Boolean);
      const body=kind==='stand'?standText():kind==='sheet'?sheetText():(msg||(who==='admin'?`Hi, this is ${me.name||'a player'} from VJ's College Pool.`:''));
      msgModal({kind:d.em?'email':'text',to:list,bcc:who==='all',body});
    }
    if(['pfsave','stsave','sqsave','sqscores','tsave','chreq','cosome','coall','sqdraw','sqcover'].includes(b.id))toast('Saved \u2713',1);
  }catch(err){toast('Could not save. Please sign in again and try once more.')}
});

$('#wk').addEventListener('input',()=>{});
init();
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(function(){})</script></body></html>
